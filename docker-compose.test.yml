# Brings up the real MQTT broker used by the integration tests in
# tests/bridge_it.rs. The OPC UA side of those tests runs an in-process test
# server (async-opcua-server as a dev-dependency), so it doesn't need a
# container here.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   docker build --target test --build-arg FEATURES="aws-secrets,influx,dashboard" .
#   docker compose -f docker-compose.test.yml down
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./tests/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
