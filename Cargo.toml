[package]
name = "opcua-to-mqtt"
version = "0.1.0"
edition = "2021"

[dependencies]
opcua = { version = "0.12", features = ["client"] }
rumqttc = "0.24"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
