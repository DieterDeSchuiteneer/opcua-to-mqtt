[package]
name = "opcua-to-mqtt"
version = "0.1.0"
edition = "2021"

[lib]
name = "opcua_to_mqtt"
path = "src/lib.rs"

[[bin]]
name = "opcua-to-mqtt"
path = "src/main.rs"

[features]
default = []
aws-secrets = ["dep:aws-sdk-secretsmanager", "dep:aws-config"]
influx = ["dep:influxdb2", "dep:futures-util"]
dashboard = ["dep:axum"]

[dependencies]
# OPC UA client (tokio-based, MPL-2.0, independent of the OPC Foundation's
# reference stacks — see licensing notes in the README). Version confirmed
# against docs.rs at plan time; re-check with `cargo update -p opcua-client`
# if this has moved on.
opcua-client = { package = "async-opcua-client", version = "0.19" }
opcua-types = { package = "async-opcua-types", version = "0.19" }

# MQTT client, async API, rustls-based TLS (no OpenSSL system dependency).
rumqttc = { version = "0.24", features = ["use-rustls"] }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"
globset = "0.4"
async-trait = "0.1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.26"
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio", "logs"] }
opentelemetry-otlp = { version = "0.26", features = ["logs", "grpc-tonic"] }
opentelemetry-appender-tracing = "0.26"

# Optional: AWS Secrets Manager-backed secret resolution.
aws-sdk-secretsmanager = { version = "1", optional = true }
aws-config = { version = "1", optional = true }

# Optional: InfluxDB sink.
influxdb2 = { version = "0.5", optional = true }
futures-util = { version = "0.3", optional = true }

# Optional: read-only HTTP status dashboard.
axum = { version = "0.8", optional = true }

[dev-dependencies]
opcua-server = { package = "async-opcua-server", version = "0.19" }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
